<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turtle Blockly</title>

  <!-- Blockly from CDN -->
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>

  <!-- Skulpt for in-browser Python execution -->
  <script src="https://skulpt.org/js/skulpt.min.js"></script>
  <script src="https://skulpt.org/js/skulpt-stdlib.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #16213e;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 2px solid #0f3460;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.3rem;
      color: #e94560;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    button {
      padding: 7px 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }

    #btn-run   { background: #27ae60; color: #fff; }
    #btn-stop  { background: #e74c3c; color: #fff; }
    #btn-clear { background: #2980b9; color: #fff; }
    #btn-code  { background: #8e44ad; color: #fff; }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #blockly-div {
      flex: 1;
      height: 100%;
    }

    .right-panel {
      width: 420px;
      display: flex;
      flex-direction: column;
      border-left: 2px solid #0f3460;
      flex-shrink: 0;
    }

    #canvas-wrap {
      flex: 1;
      background: #fff;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #turtle-canvas {
      display: block;
      background: #fff;
    }

    #code-panel {
      height: 180px;
      background: #0d1117;
      border-top: 2px solid #0f3460;
      overflow: auto;
      flex-shrink: 0;
    }

    #code-panel pre {
      padding: 10px 14px;
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      color: #58d68d;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #output-panel {
      height: 80px;
      background: #111;
      border-top: 1px solid #0f3460;
      overflow: auto;
      flex-shrink: 0;
    }

    #output-panel pre {
      padding: 6px 14px;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      color: #e0e0e0;
      white-space: pre-wrap;
    }

    .panel-label {
      background: #16213e;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #999;
      padding: 3px 14px;
      border-top: 1px solid #0f3460;
      flex-shrink: 0;
    }

    /* xml hidden */
    #blockly-xml { display: none; }
  </style>
</head>
<body>

<header>
  <h1>🐢 Turtle Blockly</h1>
  <div class="controls">
    <button id="btn-run">▶ Run</button>
    <button id="btn-stop">■ Stop</button>
    <button id="btn-clear">⬜ Clear</button>
    <button id="btn-code">{ } Code</button>
  </div>
</header>

<div class="main">
  <div id="blockly-div"></div>
  <div class="right-panel">
    <div id="canvas-wrap">
      <canvas id="turtle-canvas" width="400" height="360"></canvas>
    </div>
    <div class="panel-label">Python Code</div>
    <div id="code-panel"><pre id="code-display"># Click ▶ Run to generate and execute code</pre></div>
    <div class="panel-label">Output</div>
    <div id="output-panel"><pre id="output-display"></pre></div>
  </div>
</div>

<!-- Blockly workspace XML – default starter blocks -->
<xml id="blockly-xml" xmlns="https://developers.google.com/blockly/xml">
  <block type="turtle_forward" x="30" y="30">
    <value name="DISTANCE">
      <shadow type="math_number"><field name="NUM">100</field></shadow>
    </value>
  </block>
</xml>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// 1. CUSTOM BLOCK DEFINITIONS
// ─────────────────────────────────────────────────────────────────────────────
const TURTLE_HUE = 160;
const COLOUR_HUE = 20;

// Helper to define a block and its Python generator together
function defineTurtleBlock(name, def, pythonGen) {
  Blockly.Blocks[name] = { init: function() { this.jsonInit(def); } };
  Blockly.Python[name] = pythonGen;
}

// --- Movement ---
defineTurtleBlock('turtle_forward', {
  message0: 'forward %1',
  args0: [{ type: 'input_value', name: 'DISTANCE', check: 'Number' }],
  previousStatement: null, nextStatement: null,
  colour: TURTLE_HUE, tooltip: 'Move turtle forward', inputsInline: true
}, function(block) {
  const dist = Blockly.Python.valueToCode(block, 'DISTANCE', Blockly.Python.ORDER_NONE) || '0';
  return `turtle.forward(${dist})\n`;
});

defineTurtleBlock('turtle_backward', {
  message0: 'backward %1',
  args0: [{ type: 'input_value', name: 'DISTANCE', check: 'Number' }],
  previousStatement: null, nextStatement: null,
  colour: TURTLE_HUE, tooltip: 'Move turtle backward', inputsInline: true
}, function(block) {
  const dist = Blockly.Python.valueToCode(block, 'DISTANCE', Blockly.Python.ORDER_NONE) || '0';
  return `turtle.backward(${dist})\n`;
});

defineTurtleBlock('turtle_right', {
  message0: 'turn right %1 °',
  args0: [{ type: 'input_value', name: 'ANGLE', check: 'Number' }],
  previousStatement: null, nextStatement: null,
  colour: TURTLE_HUE, tooltip: 'Turn turtle right', inputsInline: true
}, function(block) {
  const angle = Blockly.Python.valueToCode(block, 'ANGLE', Blockly.Python.ORDER_NONE) || '0';
  return `turtle.right(${angle})\n`;
});

defineTurtleBlock('turtle_left', {
  message0: 'turn left %1 °',
  args0: [{ type: 'input_value', name: 'ANGLE', check: 'Number' }],
  previousStatement: null, nextStatement: null,
  colour: TURTLE_HUE, tooltip: 'Turn turtle left', inputsInline: true
}, function(block) {
  const angle = Blockly.Python.valueToCode(block, 'ANGLE', Blockly.Python.ORDER_NONE) || '0';
  return `turtle.left(${angle})\n`;
});

defineTurtleBlock('turtle_goto', {
  message0: 'go to x %1 y %2',
  args0: [
    { type: 'input_value', name: 'X', check: 'Number' },
    { type: 'input_value', name: 'Y', check: 'Number' }
  ],
  previousStatement: null, nextStatement: null,
  colour: TURTLE_HUE, tooltip: 'Move turtle to position', inputsInline: true
}, function(block) {
  const x = Blockly.Python.valueToCode(block, 'X', Blockly.Python.ORDER_NONE) || '0';
  const y = Blockly.Python.valueToCode(block, 'Y', Blockly.Python.ORDER_NONE) || '0';
  return `turtle.goto(${x}, ${y})\n`;
});

defineTurtleBlock('turtle_home', {
  message0: 'go home',
  previousStatement: null, nextStatement: null,
  colour: TURTLE_HUE, tooltip: 'Return turtle to origin'
}, function() { return 'turtle.home()\n'; });

// --- Pen ---
defineTurtleBlock('turtle_penup', {
  message0: 'pen up',
  previousStatement: null, nextStatement: null,
  colour: 30, tooltip: 'Lift the pen'
}, function() { return 'turtle.penup()\n'; });

defineTurtleBlock('turtle_pendown', {
  message0: 'pen down',
  previousStatement: null, nextStatement: null,
  colour: 30, tooltip: 'Lower the pen'
}, function() { return 'turtle.pendown()\n'; });

defineTurtleBlock('turtle_pensize', {
  message0: 'pen size %1',
  args0: [{ type: 'input_value', name: 'SIZE', check: 'Number' }],
  previousStatement: null, nextStatement: null,
  colour: 30, tooltip: 'Set pen width', inputsInline: true
}, function(block) {
  const size = Blockly.Python.valueToCode(block, 'SIZE', Blockly.Python.ORDER_NONE) || '1';
  return `turtle.pensize(${size})\n`;
});

// --- Colour ---
defineTurtleBlock('turtle_color', {
  message0: 'set color %1',
  args0: [{ type: 'input_value', name: 'COLOR', check: 'Colour' }],
  previousStatement: null, nextStatement: null,
  colour: COLOUR_HUE, tooltip: 'Set turtle pen colour', inputsInline: true
}, function(block) {
  const colour = Blockly.Python.valueToCode(block, 'COLOR', Blockly.Python.ORDER_NONE) || '"black"';
  return `turtle.color(${colour})\n`;
});

defineTurtleBlock('turtle_fillcolor', {
  message0: 'set fill color %1',
  args0: [{ type: 'input_value', name: 'COLOR', check: 'Colour' }],
  previousStatement: null, nextStatement: null,
  colour: COLOUR_HUE, tooltip: 'Set turtle fill colour', inputsInline: true
}, function(block) {
  const colour = Blockly.Python.valueToCode(block, 'COLOR', Blockly.Python.ORDER_NONE) || '"black"';
  return `turtle.fillcolor(${colour})\n`;
});

defineTurtleBlock('turtle_begin_fill', {
  message0: 'begin fill',
  previousStatement: null, nextStatement: null,
  colour: COLOUR_HUE, tooltip: 'Begin filling a shape'
}, function() { return 'turtle.begin_fill()\n'; });

defineTurtleBlock('turtle_end_fill', {
  message0: 'end fill',
  previousStatement: null, nextStatement: null,
  colour: COLOUR_HUE, tooltip: 'End filling a shape'
}, function() { return 'turtle.end_fill()\n'; });

// --- Background colour ---
defineTurtleBlock('turtle_bgcolor', {
  message0: 'background color %1',
  args0: [{ type: 'input_value', name: 'COLOR', check: 'Colour' }],
  previousStatement: null, nextStatement: null,
  colour: COLOUR_HUE, tooltip: 'Set background colour', inputsInline: true
}, function(block) {
  const colour = Blockly.Python.valueToCode(block, 'COLOR', Blockly.Python.ORDER_NONE) || '"white"';
  return `turtle.Screen().bgcolor(${colour})\n`;
});

// --- Shapes ---
defineTurtleBlock('turtle_circle', {
  message0: 'circle radius %1',
  args0: [{ type: 'input_value', name: 'RADIUS', check: 'Number' }],
  previousStatement: null, nextStatement: null,
  colour: TURTLE_HUE, tooltip: 'Draw a circle', inputsInline: true
}, function(block) {
  const r = Blockly.Python.valueToCode(block, 'RADIUS', Blockly.Python.ORDER_NONE) || '0';
  return `turtle.circle(${r})\n`;
});

defineTurtleBlock('turtle_dot', {
  message0: 'dot size %1',
  args0: [{ type: 'input_value', name: 'SIZE', check: 'Number' }],
  previousStatement: null, nextStatement: null,
  colour: TURTLE_HUE, tooltip: 'Draw a dot', inputsInline: true
}, function(block) {
  const s = Blockly.Python.valueToCode(block, 'SIZE', Blockly.Python.ORDER_NONE) || '5';
  return `turtle.dot(${s})\n`;
});

// --- Turtle shape ---
defineTurtleBlock('turtle_shape', {
  message0: 'turtle shape %1',
  args0: [{
    type: 'field_dropdown', name: 'SHAPE',
    options: [['arrow','arrow'],['turtle','turtle'],['circle','circle'],['square','square'],['triangle','triangle'],['classic','classic']]
  }],
  previousStatement: null, nextStatement: null,
  colour: TURTLE_HUE, tooltip: 'Set turtle shape'
}, function(block) {
  const shape = block.getFieldValue('SHAPE');
  return `turtle.shape("${shape}")\n`;
});

// --- Speed ---
defineTurtleBlock('turtle_speed', {
  message0: 'speed %1',
  args0: [{
    type: 'field_dropdown', name: 'SPEED',
    options: [['fastest','0'],['fast','10'],['normal','6'],['slow','3'],['slowest','1']]
  }],
  previousStatement: null, nextStatement: null,
  colour: TURTLE_HUE, tooltip: 'Set turtle speed'
}, function(block) {
  const speed = block.getFieldValue('SPEED');
  return `turtle.speed(${speed})\n`;
});

// --- Hide/show ---
defineTurtleBlock('turtle_hideturtle', {
  message0: 'hide turtle',
  previousStatement: null, nextStatement: null,
  colour: TURTLE_HUE, tooltip: 'Hide the turtle'
}, function() { return 'turtle.hideturtle()\n'; });

defineTurtleBlock('turtle_showturtle', {
  message0: 'show turtle',
  previousStatement: null, nextStatement: null,
  colour: TURTLE_HUE, tooltip: 'Show the turtle'
}, function() { return 'turtle.showturtle()\n'; });

// --- Write text ---
defineTurtleBlock('turtle_write', {
  message0: 'write %1 font size %2',
  args0: [
    { type: 'input_value', name: 'TEXT' },
    { type: 'input_value', name: 'SIZE', check: 'Number' }
  ],
  previousStatement: null, nextStatement: null,
  colour: TURTLE_HUE, tooltip: 'Write text', inputsInline: true
}, function(block) {
  const text = Blockly.Python.valueToCode(block, 'TEXT', Blockly.Python.ORDER_NONE) || '""';
  const size = Blockly.Python.valueToCode(block, 'SIZE', Blockly.Python.ORDER_NONE) || '12';
  return `turtle.write(${text}, font=('Arial', ${size}, 'normal'))\n`;
});

// --- Clear ---
defineTurtleBlock('turtle_clear', {
  message0: 'clear screen',
  previousStatement: null, nextStatement: null,
  colour: TURTLE_HUE, tooltip: 'Clear the screen'
}, function() { return 'turtle.clear()\n'; });

defineTurtleBlock('turtle_reset', {
  message0: 'reset',
  previousStatement: null, nextStatement: null,
  colour: TURTLE_HUE, tooltip: 'Reset turtle to start'
}, function() { return 'turtle.reset()\n'; });

// --- Setheading ---
defineTurtleBlock('turtle_setheading', {
  message0: 'set heading %1 °',
  args0: [{ type: 'input_value', name: 'ANGLE', check: 'Number' }],
  previousStatement: null, nextStatement: null,
  colour: TURTLE_HUE, tooltip: 'Set the turtle heading', inputsInline: true
}, function(block) {
  const angle = Blockly.Python.valueToCode(block, 'ANGLE', Blockly.Python.ORDER_NONE) || '0';
  return `turtle.setheading(${angle})\n`;
});

// ─────────────────────────────────────────────────────────────────────────────
// 2. TOOLBOX DEFINITION
// ─────────────────────────────────────────────────────────────────────────────
const toolbox = {
  kind: 'categoryToolbox',
  contents: [
    {
      kind: 'category', name: '🐢 Movement', colour: TURTLE_HUE,
      contents: [
        { kind: 'block', type: 'turtle_forward',
          inputs: { DISTANCE: { shadow: { type: 'math_number', fields: { NUM: 100 } } } } },
        { kind: 'block', type: 'turtle_backward',
          inputs: { DISTANCE: { shadow: { type: 'math_number', fields: { NUM: 100 } } } } },
        { kind: 'block', type: 'turtle_right',
          inputs: { ANGLE: { shadow: { type: 'math_number', fields: { NUM: 90 } } } } },
        { kind: 'block', type: 'turtle_left',
          inputs: { ANGLE: { shadow: { type: 'math_number', fields: { NUM: 90 } } } } },
        { kind: 'block', type: 'turtle_goto',
          inputs: {
            X: { shadow: { type: 'math_number', fields: { NUM: 0 } } },
            Y: { shadow: { type: 'math_number', fields: { NUM: 0 } } }
          } },
        { kind: 'block', type: 'turtle_home' },
        { kind: 'block', type: 'turtle_setheading',
          inputs: { ANGLE: { shadow: { type: 'math_number', fields: { NUM: 0 } } } } },
        { kind: 'block', type: 'turtle_circle',
          inputs: { RADIUS: { shadow: { type: 'math_number', fields: { NUM: 50 } } } } },
        { kind: 'block', type: 'turtle_dot',
          inputs: { SIZE: { shadow: { type: 'math_number', fields: { NUM: 10 } } } } },
      ]
    },
    {
      kind: 'category', name: '✏️ Pen', colour: 30,
      contents: [
        { kind: 'block', type: 'turtle_penup' },
        { kind: 'block', type: 'turtle_pendown' },
        { kind: 'block', type: 'turtle_pensize',
          inputs: { SIZE: { shadow: { type: 'math_number', fields: { NUM: 2 } } } } },
        { kind: 'block', type: 'turtle_clear' },
        { kind: 'block', type: 'turtle_reset' },
      ]
    },
    {
      kind: 'category', name: '🎨 Colour', colour: COLOUR_HUE,
      contents: [
        { kind: 'block', type: 'turtle_color',
          inputs: { COLOR: { shadow: { type: 'colour_picker', fields: { COLOUR: '#ff0000' } } } } },
        { kind: 'block', type: 'turtle_fillcolor',
          inputs: { COLOR: { shadow: { type: 'colour_picker', fields: { COLOUR: '#ffff00' } } } } },
        { kind: 'block', type: 'turtle_begin_fill' },
        { kind: 'block', type: 'turtle_end_fill' },
        { kind: 'block', type: 'turtle_bgcolor',
          inputs: { COLOR: { shadow: { type: 'colour_picker', fields: { COLOUR: '#ffffff' } } } } },
        { kind: 'block', type: 'colour_picker' },
        { kind: 'block', type: 'colour_rgb' },
        { kind: 'block', type: 'colour_blend' },
        { kind: 'block', type: 'colour_random' },
      ]
    },
    {
      kind: 'category', name: '🐾 Turtle', colour: TURTLE_HUE,
      contents: [
        { kind: 'block', type: 'turtle_shape' },
        { kind: 'block', type: 'turtle_speed' },
        { kind: 'block', type: 'turtle_hideturtle' },
        { kind: 'block', type: 'turtle_showturtle' },
        { kind: 'block', type: 'turtle_write',
          inputs: {
            TEXT: { shadow: { type: 'text', fields: { TEXT: 'Hello!' } } },
            SIZE: { shadow: { type: 'math_number', fields: { NUM: 14 } } }
          } },
      ]
    },
    {
      kind: 'category', name: '🔁 Loops', colour: '#5C81A6',
      contents: [
        { kind: 'block', type: 'controls_repeat_ext',
          inputs: { TIMES: { shadow: { type: 'math_number', fields: { NUM: 4 } } } } },
        { kind: 'block', type: 'controls_whileUntil' },
        { kind: 'block', type: 'controls_for',
          inputs: {
            FROM: { shadow: { type: 'math_number', fields: { NUM: 1 } } },
            TO:   { shadow: { type: 'math_number', fields: { NUM: 10 } } },
            BY:   { shadow: { type: 'math_number', fields: { NUM: 1 } } }
          } },
        { kind: 'block', type: 'controls_forEach' },
        { kind: 'block', type: 'controls_flow_statements' },
      ]
    },
    {
      kind: 'category', name: '🔀 Logic', colour: '#5C68A6',
      contents: [
        { kind: 'block', type: 'controls_if' },
        { kind: 'block', type: 'logic_compare' },
        { kind: 'block', type: 'logic_operation' },
        { kind: 'block', type: 'logic_negate' },
        { kind: 'block', type: 'logic_boolean' },
        { kind: 'block', type: 'logic_null' },
        { kind: 'block', type: 'logic_ternary' },
      ]
    },
    {
      kind: 'category', name: '🔢 Maths', colour: '#5C68A6',
      contents: [
        { kind: 'block', type: 'math_number' },
        { kind: 'block', type: 'math_arithmetic' },
        { kind: 'block', type: 'math_single' },
        { kind: 'block', type: 'math_trig' },
        { kind: 'block', type: 'math_constant' },
        { kind: 'block', type: 'math_number_property' },
        { kind: 'block', type: 'math_round' },
        { kind: 'block', type: 'math_modulo' },
        { kind: 'block', type: 'math_constrain',
          inputs: {
            LOW:  { shadow: { type: 'math_number', fields: { NUM: 1 } } },
            HIGH: { shadow: { type: 'math_number', fields: { NUM: 100 } } }
          } },
        { kind: 'block', type: 'math_random_int',
          inputs: {
            FROM: { shadow: { type: 'math_number', fields: { NUM: 1 } } },
            TO:   { shadow: { type: 'math_number', fields: { NUM: 100 } } }
          } },
        { kind: 'block', type: 'math_random_float' },
      ]
    },
    {
      kind: 'category', name: '📝 Text', colour: '#5CA65C',
      contents: [
        { kind: 'block', type: 'text' },
        { kind: 'block', type: 'text_join' },
        { kind: 'block', type: 'text_length' },
        { kind: 'block', type: 'text_print' },
      ]
    },
    {
      kind: 'category', name: '📦 Variables', colour: '#A65C81', custom: 'VARIABLE'
    },
    {
      kind: 'category', name: '⚙️ Functions', colour: '#9A5CA6', custom: 'PROCEDURE'
    },
  ]
};

// ─────────────────────────────────────────────────────────────────────────────
// 3. INJECT BLOCKLY WORKSPACE
// ─────────────────────────────────────────────────────────────────────────────
const workspace = Blockly.inject('blockly-div', {
  toolbox: toolbox,
  grid: { spacing: 20, length: 3, colour: '#2a2a4a', snap: true },
  zoom: { controls: true, wheel: true, startScale: 0.9, maxScale: 3, minScale: 0.3, scaleSpeed: 1.2 },
  trashcan: true,
  theme: Blockly.Themes.Dark,
});

// Load starter block
const startXml = document.getElementById('blockly-xml').innerHTML;
Blockly.Xml.domToWorkspace(Blockly.Xml.textToDom(startXml), workspace);

// Keep canvas sized to its container
function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const canvas = document.getElementById('turtle-canvas');
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  canvas.width  = w;
  canvas.height = h;
}
window.addEventListener('resize', () => { Blockly.svgResize(workspace); resizeCanvas(); });
resizeCanvas();

// ─────────────────────────────────────────────────────────────────────────────
// 4. PYTHON CODE GENERATION HELPER
// ─────────────────────────────────────────────────────────────────────────────
function generateCode() {
  // Make sure colour blocks use hex strings
  Blockly.Python.colour_picker = function(block) {
    const colour = block.getFieldValue('COLOUR');
    return [`"${colour}"`, Blockly.Python.ORDER_ATOMIC];
  };
  Blockly.Python.colour_rgb = function(block) {
    const r = Blockly.Python.valueToCode(block, 'RED',   Blockly.Python.ORDER_NONE) || '0';
    const g = Blockly.Python.valueToCode(block, 'GREEN', Blockly.Python.ORDER_NONE) || '0';
    const b = Blockly.Python.valueToCode(block, 'BLUE',  Blockly.Python.ORDER_NONE) || '0';
    const code = `'#{:02x}{:02x}{:02x}'.format(int(${r}*255), int(${g}*255), int(${b}*255))`;
    return [code, Blockly.Python.ORDER_FUNCTION_CALL];
  };
  Blockly.Python.colour_blend = function(block) {
    const c1    = Blockly.Python.valueToCode(block, 'COLOUR1', Blockly.Python.ORDER_NONE) || '"#000000"';
    const c2    = Blockly.Python.valueToCode(block, 'COLOUR2', Blockly.Python.ORDER_NONE) || '"#ffffff"';
    const ratio = Blockly.Python.valueToCode(block, 'RATIO',   Blockly.Python.ORDER_NONE) || '0.5';
    // Simple blend helper (emitted inline once)
    const code = `_blend_colour(${c1}, ${c2}, ${ratio})`;
    return [code, Blockly.Python.ORDER_FUNCTION_CALL];
  };
  Blockly.Python.colour_random = function() {
    return ['_random_colour()', Blockly.Python.ORDER_FUNCTION_CALL];
  };

  const raw = Blockly.Python.workspaceToCode(workspace);

  const needsBlend  = raw.includes('_blend_colour');
  const needsRandom = raw.includes('_random_colour');

  let helpers = '';
  if (needsBlend) {
    helpers += `
def _blend_colour(c1, c2, ratio):
    if not (c1.startswith('#') and len(c1)==7 and c2.startswith('#') and len(c2)==7):
        return c1
    r1,g1,b1 = int(c1[1:3],16),int(c1[3:5],16),int(c1[5:7],16)
    r2,g2,b2 = int(c2[1:3],16),int(c2[3:5],16),int(c2[5:7],16)
    r=int(r1+(r2-r1)*ratio); g=int(g1+(g2-g1)*ratio); b=int(b1+(b2-b1)*ratio)
    return '#{:02x}{:02x}{:02x}'.format(r,g,b)
`;
  }
  if (needsRandom) {
    helpers += `
import random
def _random_colour():
    return '#{:02x}{:02x}{:02x}'.format(random.randint(0,255),random.randint(0,255),random.randint(0,255))
`;
  }

  return `import turtle\n${helpers}\n${raw}`;
}

// ─────────────────────────────────────────────────────────────────────────────
// 5. SKULPT TURTLE RUNNER
// ─────────────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('turtle-canvas');
const codeDisplay  = document.getElementById('code-display');
const outputDisplay = document.getElementById('output-display');

let running = false;

function runCode() {
  if (running) return;
  running = true;

  const code = generateCode();
  codeDisplay.textContent = code;
  outputDisplay.textContent = '';

  // Clear canvas
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  Sk.configure({
    output: function(text) {
      outputDisplay.textContent += text;
    },
    read: function(x) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles.files[x] === undefined) {
        throw new Error("File not found: '" + x + "'");
      }
      return Sk.builtinFiles.files[x];
    },
    __future__: Sk.python3,
  });

  Sk.TurtleGraphics = {
    target: canvas,
    width:  canvas.width,
    height: canvas.height,
    animate: true,
  };

  const promise = Sk.misceval.asyncToPromise(function() {
    return Sk.importMainWithBody('<stdin>', false, code, true);
  });

  promise.then(
    function() {
      running = false;
      outputDisplay.textContent += '\n✅ Done';
    },
    function(err) {
      running = false;
      outputDisplay.textContent += '\n❌ ' + (err.toString());
    }
  );
}

function stopCode() {
  // Skulpt doesn't have a built-in stop; reload the turtle module state
  Sk.TurtleGraphics = { target: canvas, width: canvas.width, height: canvas.height };
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  running = false;
  outputDisplay.textContent = '⏹ Stopped';
}

function clearCanvas() {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  outputDisplay.textContent = '';
  running = false;
}

function toggleCode() {
  const panel = document.getElementById('code-panel');
  panel.style.display = panel.style.display === 'none' ? '' : 'none';
}

// Live code preview on workspace change
workspace.addChangeListener(function() {
  try {
    codeDisplay.textContent = generateCode();
  } catch (e) { console.debug('Code generation error:', e); }
});

document.getElementById('btn-run').addEventListener('click', runCode);
document.getElementById('btn-stop').addEventListener('click', stopCode);
document.getElementById('btn-clear').addEventListener('click', clearCanvas);
document.getElementById('btn-code').addEventListener('click', toggleCode);
</script>
